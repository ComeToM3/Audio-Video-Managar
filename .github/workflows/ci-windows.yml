# AVM-10C — CI Windows : assertions + codes de sortie process
name: ci-windows

on:
  push:
    branches: [main, master, "avm-*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    name: Windows Python 3.12
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-dev.txt

      - name: Run orchestrated suite (domain + UI subprocesses)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
          # AVM-10C.2 — fermeture naturelle (os._exit seulement si forcé localement)
          AVM_QT_SAFE_EXIT: "0"
        run: |
          python scripts/run_tests_ci.py \
            --junit-dir .ci/junit \
            --report .ci/avm10c-results.json

      - name: Upload JUnit + summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avm10c-ci-artifacts
          path: |
            .ci/junit/**
            .ci/avm10c-results.json
          if-no-files-found: warn
