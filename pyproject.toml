[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-video-manager"
version = "0.5.0"
description = "Windows local app for automated audio CD archival to FLAC"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "AudioVideoManager contributors" }]
dependencies = [
    "PySide6>=6.6",
    "discid>=1.2",
    "musicbrainzngs>=0.7",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
audio-video-manager = "audio_video_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_video_manager*"]

[tool.setuptools.package-data]
audio_video_manager = [
    "ui/fonts/*.ttf",
    "ui/fonts/*.txt",
    "ui/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# AVM-10C.2 : diagnostics unraisableexception actifs (teardown Qt centralisé)
addopts = "-q"
markers = [
    "qt_ui: tests PySide6/QML",
    "requires_freac: freaccmd requis",
    "requires_discid: discid.dll requis",
    "requires_ffmpeg: ffmpeg requis",
    "windows_real: validation Windows réelle",
]
